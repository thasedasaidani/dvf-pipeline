name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Spark a besoin de Java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Lancer les tests
        run: pytest -v

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier le docker-compose
        run: cp .env.example .env && docker compose config --quiet

      - name: Construire l'image de l'API
        run: docker build -f docker/api/Dockerfile -t dvf-api .
